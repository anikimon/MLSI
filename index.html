<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14527c">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>НИЛ «МЛСИ» | Планировщик исследований</title>
  <style>
    :root { --ink:#193a54; --muted:#668095; --paper:#f4faff; --white:#fff; --line:#dbeaf4; --plum:#14527c; --plum-light:#1b6899; --orange:#096ba7; --orange-pale:#eaf6ff; --green:#27789e; --blue:#357db4; --shadow:0 18px 50px #163f6210; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    a { color:inherit; text-decoration:none; }
    .shell { display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100vh; }
    .sidebar { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:30px 18px 20px; background:var(--plum); color:#fff; }
    .brand { padding:0 14px; font-size:21px; font-weight:800; letter-spacing:-.04em; white-space:nowrap; }
    .brand-sub { padding:9px 15px 0; color:#b5d5e9; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    .nav-label { margin:52px 15px 14px; color:#a9cfe7; font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    .nav-item { width:100%; display:flex; align-items:center; gap:12px; padding:13px 15px; border:0; border-radius:10px; color:#d0e7f6; background:transparent; text-align:left; font-size:14px; font-weight:600; }
    .nav-item:hover,.nav-item.active { color:#fff; background:#ffffff16; }
    .nav-item.active { box-shadow:inset 3px 0 var(--orange); }
    .nav-icon { width:19px; font-size:18px; line-height:1; text-align:center; }
    .sidebar-bottom { margin-top:auto; padding:16px 12px 0; border-top:1px solid #ffffff22; }
    .user-card { display:flex; align-items:center; gap:10px; }
    .avatar { display:grid; place-items:center; flex:none; width:36px; height:36px; border-radius:10px; color:#fff; background:#3989b8; font-weight:800; }
    .user-card strong { display:block; max-width:145px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
    .user-card small { color:#b5d5e9; font-size:11px; }
    .logout { margin:14px 0 0; padding:5px 0; border:0; color:#b5d5e9; background:none; font-size:12px; }
    .logout:hover { color:#fff; }
    .main { min-width:0; padding:0 clamp(22px,4vw,72px) 80px; }
    .topbar { height:80px; display:flex; align-items:center; justify-content:space-between; gap:14px; border-bottom:1px solid var(--line); }
    .breadcrumb { color:var(--muted); font-size:13px; }
    .breadcrumb b { color:var(--ink); }
    .top-meta { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; }
    .top-dot { width:8px; height:8px; border-radius:50%; background:#4fa6d5; box-shadow:0 0 0 4px #4fa6d51d; }
    .page { max-width:1180px; margin:0 auto; }
    .page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin:38px 0 27px; }
    .eyebrow { margin:0 0 7px; color:var(--orange); font-size:11px; font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
    h1,h2,h3,p { margin-top:0; }
    h1 { margin-bottom:7px; font-size:clamp(29px,3.3vw,43px); font-weight:700; letter-spacing:-.045em; line-height:1.12; }
    h2 { font-size:20px; letter-spacing:-.035em; }
    h3 { font-size:15px; }
    .lead { margin:0; color:var(--muted); font-size:13px; line-height:1.6; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:40px; padding:9px 15px; border:1px solid transparent; border-radius:9px; background:var(--plum); color:#fff; font-size:12px; font-weight:700; white-space:nowrap; }
    .btn:hover { background:var(--plum-light); }
    .btn.secondary { border-color:var(--line); background:#fff; color:var(--ink); }
    .btn.secondary:hover { background:#edf7ff; border-color:#a9d0e9; }
    .btn.orange { background:var(--orange); }
    .btn.orange:hover { background:#075684; }
    .btn.small { min-height:33px; padding:7px 11px; font-size:11px; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:33px; }
    .stat { min-height:125px; padding:21px; border:1px solid var(--line); border-radius:13px; background:var(--white); box-shadow:var(--shadow); }
    .stat-label { color:var(--muted); font-size:11px; font-weight:600; }
    .stat-number { display:block; margin:13px 0 4px; font-size:37px; font-weight:750; line-height:1; }
    .stat-note { color:#8aa3b6; font-size:10px; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:28px 0 16px; }
    .section-head h2 { margin:0; }
    .section-head span { color:var(--muted); font-size:12px; }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
    .study-card { position:relative; display:block; width:100%; min-height:195px; padding:22px; border:1px solid var(--line); border-radius:13px; background:#fff; box-shadow:var(--shadow); text-align:left; transition:transform .16s,border-color .16s; }
    .study-card:hover { transform:translateY(-2px); border-color:#9bc9e7; }
    .card-top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:22px; }
    .card-id { color:#829bac; font-size:11px; font-weight:700; letter-spacing:.07em; }
    .badge { display:inline-block; padding:6px 9px; border-radius:6px; background:#eaf3ff; color:#2c679d; font-size:10px; font-weight:750; white-space:nowrap; }
    .badge.field { color:#086e9d; background:#e2f7ff; }
    .badge.processing { color:#2860a0; background:#e9f1fc; }
    .badge.completed { color:#27789e; background:#e7f7fc; }
    .study-card h3 { margin:0 0 9px; font-size:17px; line-height:1.35; }
    .study-card p { height:35px; overflow:hidden; margin:0 0 16px; color:var(--muted); font-size:12px; line-height:1.5; }
    .card-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:14px; border-top:1px solid var(--line); color:#718da0; font-size:11px; }
    .empty { padding:46px 30px; border:1px dashed #bad6e8; border-radius:13px; background:#fff; color:var(--muted); text-align:center; }
    .empty strong { display:block; margin-bottom:8px; color:var(--ink); font-size:16px; }
    .back { padding:0; border:0; background:none; color:var(--muted); font-size:12px; }
    .back:hover { color:var(--orange); }
    .detail-layout { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(270px,.9fr); gap:18px; align-items:start; }
    .box { padding:24px; border:1px solid var(--line); border-radius:13px; background:#fff; box-shadow:var(--shadow); }
    .box + .box { margin-top:18px; }
    .box-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .box-title h2 { margin:0; font-size:17px; }
    .description { color:#506e84; font-size:13px; line-height:1.7; white-space:pre-wrap; }
    .info-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
    .info-label { margin-bottom:5px; color:#829bad; font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
    .info-value { font-size:13px; font-weight:650; }
    .stage-list { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin:16px 0 10px; }
    .stage { padding:12px 5px; border:1px solid var(--line); border-radius:7px; background:#f8fcff; color:#8aa3b5; font-size:10px; font-weight:700; text-align:center; }
    .stage.current { border-color:#83bde2; background:#e5f4ff; color:#096ba7; }
    .stage.past { background:#ebf7ff; color:#3980aa; }
    button.stage:hover:not(:disabled) { border-color:var(--orange); }
    .file-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
    .file-row:last-child { border-bottom:0; }
    .file-icon { display:grid; place-items:center; width:33px; height:33px; border-radius:8px; background:#eaf6ff; color:#267db2; font-size:15px; }
    .file-row a { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); font-size:12px; font-weight:650; }
    .file-row a:hover { color:var(--orange); }
    .file-row small { margin-left:auto; color:#809bad; white-space:nowrap; font-size:10px; }
    .muted { color:var(--muted); font-size:12px; line-height:1.6; }
    .upload-form { display:flex; gap:8px; flex-wrap:wrap; margin-top:17px; }
    .upload-form input[type=file] { flex:1; min-width:140px; max-width:100%; font-size:11px; }
    .upload-form select { min-height:37px; width:auto; }
    .field-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .field-card { padding:19px; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .field-card h3 { margin:10px 0 6px; font-size:15px; }
    .field-card p { margin-bottom:14px; color:var(--muted); font-size:12px; }
    .team-list { display:grid; gap:10px; }
    .team-row { display:flex; align-items:center; gap:13px; padding:14px 17px; border:1px solid var(--line); border-radius:11px; background:#fff; }
    .team-row .avatar { background:#e7f4fd; color:#236b99; }
    .team-row strong { font-size:13px; }
    .team-row small { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    .team-row .badge { margin-left:auto; }
    .modal-layer { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:16px; background:#0f314db0; }
    .modal-layer.show { display:flex; }
    .modal { width:min(620px,100%); max-height:min(90vh,900px); overflow:auto; padding:27px; border-radius:16px; background:#fff; box-shadow:0 25px 100px #123b6055; }
    .modal.wide { width:min(760px,100%); }
    .modal-head { display:flex; justify-content:space-between; align-items:start; gap:16px; margin-bottom:20px; }
    .modal-head h2 { margin:0; font-size:26px; font-weight:700; }
    .close { border:0; background:none; color:var(--muted); font-size:23px; line-height:1; }
    .form-grid { display:grid; gap:15px; }
    .form-two { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    label.field-label { display:block; margin-bottom:6px; color:#4e6a80; font-size:11px; font-weight:700; }
    input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select { width:100%; min-height:40px; padding:10px 11px; border:1px solid #cbdfea; border-radius:8px; outline:none; background:#fff; color:var(--ink); font-size:13px; }
    textarea { min-height:85px; resize:vertical; }
    input:focus,textarea:focus,select:focus { border-color:#62addb !important; box-shadow:0 0 0 3px #62addb24; }
    .actions { display:flex; justify-content:flex-end; gap:9px; margin-top:21px; }
    .question-edit { margin-bottom:10px; padding:15px; border:1px solid var(--line); border-radius:10px; background:#f7fbff; }
    .question-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
    .question-top strong { color:var(--orange); font-size:11px; }
    .text-button { border:0; background:none; color:var(--orange); font-size:11px; font-weight:700; }
    .question-edit .form-two { margin-bottom:10px; }
    .check-label { display:inline-flex; align-items:center; gap:7px; color:#506e84; font-size:12px; }
    .survey-item { margin-bottom:19px; padding:17px; border:1px solid var(--line); border-radius:10px; }
    .survey-item strong { display:block; margin-bottom:11px; font-size:13px; }
    .survey-choice { display:flex; align-items:center; gap:9px; margin:9px 0; color:#506e84; font-size:13px; }
    .survey-choice input { accent-color:var(--orange); }
    .auth-wrap { min-height:100vh; display:grid; grid-template-columns:minmax(260px,1fr) minmax(400px,1fr); }
    .auth-art { display:flex; flex-direction:column; justify-content:space-between; padding:50px clamp(30px,6vw,95px); background:var(--plum); color:#fff; }
    .auth-art h1 { max-width:520px; font-size:clamp(39px,5vw,72px); line-height:1.05; }
    .auth-art p { max-width:430px; color:#c8e2f2; font-size:15px; line-height:1.7; }
    .auth-art .brand { padding:0; }
    .auth-art small { color:#b5d5e9; font-size:11px; }
    .auth-form { display:grid; place-items:center; padding:30px; }
    .auth-card { width:min(370px,100%); }
    .auth-card h2 { margin-bottom:8px; font-size:33px; font-weight:700; }
    .auth-card .lead { margin-bottom:28px; }
    .auth-card .btn { width:100%; margin-top:8px; }
    .notice { position:fixed; z-index:30; right:22px; bottom:22px; max-width:min(390px,calc(100vw - 44px)); padding:13px 17px; border-radius:10px; background:var(--plum); color:#fff; box-shadow:0 12px 30px #0003; font-size:12px; }
    .notice.error { background:#a34442; }
    .sync-status { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); }
    .sync-status button { padding:4px 7px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); font-size:11px; }
    .weighting-form { padding:17px; border:1px solid var(--line); border-radius:10px; background:#f4faff; }
    .weighting-options { display:grid; gap:9px; margin:12px 0; }
    .weighting-row { display:grid; grid-template-columns:minmax(0,1fr) 110px; align-items:center; gap:10px; font-size:12px; }
    .weighting-row span { overflow-wrap:anywhere; }
    .report-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:0 0 22px; }
    .report-metric { padding:15px; border:1px solid var(--line); border-radius:9px; background:#f4faff; }
    .report-metric strong { display:block; margin-top:5px; font-size:22px; }
    .report-question { margin-top:14px; padding:17px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; break-inside:avoid; }
    .report-question h3 { margin-bottom:5px; line-height:1.4; }
    .report-section { margin-top:18px; }
    .analytical-body { margin-top:18px; padding:22px; border:1px solid var(--line); border-radius:10px; background:#f9fbfc; overflow-wrap:anywhere; line-height:1.5; font:14pt/1.5 "Times New Roman",Times,serif; text-align:justify; }
    .analytical-body p { text-indent:1.25cm; margin:0 0 1em; }
    .slide-stage { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border:1px solid var(--line); border-radius:12px; box-shadow:0 18px 42px #152e4326; }
    .slide-element { position:absolute; overflow:hidden; white-space:pre-wrap; overflow-wrap:anywhere; cursor:grab; touch-action:none; font-size:clamp(10px,1.5vw,18px); line-height:1.32; user-select:none; }
    .slide-element.title { font-size:clamp(14px,2.3vw,29px); font-weight:700; line-height:1.12; }
    .slide-element.body { line-height:1.48; }
    .slide-element.tag { letter-spacing:.12em; text-transform:uppercase; }
    .slide-element.callout { line-height:1.25; }
    .slide-decoration { position:absolute; pointer-events:none; }
    .slide-decoration.card { left:7%; top:34%; width:86%; height:56%; border-radius:18px; }
    .slide-decoration.stripe { left:7%; top:34%; width:.7%; height:56%; }
    .slide-decoration.cover-stripe { left:7%; top:23%; width:.7%; height:53%; }
    .slide-decoration.cover-orb { left:70%; top:-18%; width:50%; height:89%; border-radius:50%; }
    .slide-decoration.cover-orb-inner { left:80%; top:3%; width:30%; height:54%; border-radius:50%; }
    .slide-decoration.dot { left:91%; top:8%; width:3%; aspect-ratio:1; border-radius:50%; }
    .slide-decoration.split-panel { left:52%; top:35%; width:40%; height:54%; border-radius:18px; }
    .slide-decoration.spotlight-panel { left:8%; top:34%; width:84%; height:29%; border-radius:18px; }
    .slide-decoration.pill { left:8%; top:4%; width:46%; height:8%; border-radius:100px; }
    .slide-decoration.callout-card { left:9%; top:76%; width:82%; height:13%; border-radius:12px; }
    .slide-decoration.rule { left:9%; top:92%; width:82%; height:.25%; }
    .slide-page { position:absolute; right:6%; bottom:3%; font:600 10px Aptos,sans-serif; letter-spacing:.12em; pointer-events:none; }
    .slide-element.selected { outline:2px dashed currentColor; outline-offset:2px; }
    .slide-tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 0; }
    .slide-tools select { width:auto; }
    .presentation-fields { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:14px 0; }
    .presentation-fields input[type=color] { width:100%; height:40px; padding:2px; }
    .report-chart { display:grid; gap:10px; margin-top:16px; }
    .report-bar-row { display:grid; grid-template-columns:minmax(100px,1fr) minmax(90px,2fr) 54px; gap:10px; align-items:center; font-size:12px; }
    .report-bar-label { overflow-wrap:anywhere; }
    .report-bar-track { height:12px; border-radius:6px; background:#eaf6ff; overflow:hidden; }
    .report-bar-fill { display:block; height:100%; background:#357db4; border-radius:6px; }
    .report-bar-value { text-align:right; font-variant-numeric:tabular-nums; }
    .report-table { width:100%; min-width:420px; margin-top:12px; border-collapse:collapse; font-size:12px; }
    .report-table th,.report-table td { padding:8px 5px; border-bottom:1px solid var(--line); text-align:left; }
    .report-table th:not(:first-child),.report-table td:not(:first-child) { text-align:right; }
    .quota-list { display:grid; gap:15px; }
    .quota-group { padding:14px; border:1px solid var(--line); border-radius:9px; background:#f8fcff; }
    .quota-group h3 { margin:0 0 11px; }
    .quota-line { display:grid; grid-template-columns:minmax(95px,1fr) minmax(75px,2fr) 110px; gap:10px; align-items:center; margin:8px 0; font-size:12px; }
    .quota-line span:first-child { overflow-wrap:anywhere; }
    .quota-line strong { text-align:right; font-size:11px; }
    .quota-edit { display:grid; gap:9px; margin:15px 0; }
    .quota-input { display:grid; grid-template-columns:minmax(0,1fr) 110px; gap:9px; align-items:center; font-size:12px; }
    .quota-input.range { grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto; }
    .quota-input input { min-width:0; }
    .quota-board { margin:32px 0; }
    .quota-board .quota-list { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .chat-messages { display:grid; gap:10px; max-height:350px; overflow:auto; padding:15px; border:1px solid var(--line); border-radius:9px; background:#f8fcff; }
    .chat-message { max-width:90%; padding:10px 13px; border-radius:9px; background:#fff; border:1px solid var(--line); }
    .chat-message.own { justify-self:end; background:#eaf6ff; }
    .chat-message header { display:flex; gap:12px; justify-content:space-between; color:var(--muted); font-size:10px; }
    .chat-message p { margin:7px 0 0; font-size:13px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }
    .chat-form { display:flex; gap:9px; align-items:flex-end; margin-top:12px; }
    .chat-form textarea { min-height:65px; }
    .member-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .member-check { padding:10px; border:1px solid var(--line); border-radius:8px; font-size:12px; }
    .compound-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; gap:8px; align-items:center; }
    .compound-row .bounds { display:flex; gap:6px; }
    .focus-guide { max-height:40vh; overflow:auto; padding:16px; border:1px solid var(--line); border-radius:10px; background:#f8fcff; }
    .focus-guide p { margin:0; padding:13px 8px; white-space:pre-wrap; line-height:1.6; border-bottom:1px solid var(--line); }
    .focus-guide p.active { border-radius:7px; background:#deefff; }
    .focus-controls { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin:13px 0; }
    .focus-tabs { display:flex; gap:6px; margin:20px 0; padding:5px; border-radius:10px; background:#eaf4fb; }
    .focus-tabs button { flex:1; min-width:0; border:0; border-radius:7px; padding:11px 4px; background:transparent; color:var(--navy); font:inherit; font-size:12px; font-weight:700; overflow-wrap:anywhere; cursor:pointer; }
    .focus-tabs button[aria-pressed="true"] { background:#fff; box-shadow:0 2px 8px #1d56701a; }
    .focus-pane[hidden] { display:none; }
    .digital-dialog { max-height:45vh; overflow:auto; margin:16px 0; padding:12px; border:1px solid var(--line); border-radius:10px; }
    .digital-dialog .chat-message { margin-bottom:12px; }
    .digital-persona { margin:12px 0; padding:12px; border:1px solid var(--line); border-radius:10px; }
    .digital-persona textarea { min-height:75px; }
    #focus-guide-stop[hidden] { display:none; }
    .editor-layout { display:grid; grid-template-columns:minmax(0,2.4fr) minmax(285px,1fr); gap:18px; align-items:start; }
    .editor-toolbar { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:17px; }
    .editor-pane textarea { min-height:60vh; line-height:1.65; resize:vertical; }
    .editor-actions { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-top:14px; }
    .assistant-pane { position:sticky; top:20px; }

</head>
<body>
  <div id="app"></div>
  <div class="modal-layer" id="modal-layer"><div class="modal" id="modal"></div></div>
  <script>
    const state = { user: null, users: [], studies: [], tab: 'overview', selected: null, offline: false };
    const stages = { development: 'Разработка', field: 'Полевой этап', processing: 'Обработка', completed: 'Завершено' };
    const roles = { admin: 'Администратор', researcher: 'Исследователь', interviewer: 'Интервьюер' };
    const fileKinds = { brief: 'ТЗ', questionnaire: 'Анкета', guide: 'Гайд', other: 'Другое' };
    const types = { text: 'Короткий ответ', textarea: 'Развёрнутый ответ', number: 'Число', single: 'Один вариант', multiple: 'Несколько вариантов' };
    const app = document.querySelector('#app');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]);
    const isAdmin = () => state.user?.role === 'admin';
    const canManage = () => ['admin','researcher'].includes(state.user?.role) && !state.offline;
    const allowedTabs = () => isAdmin() ? ['overview','studies','media','calendar','field','focus','editor','team'] : state.user?.role === 'researcher' ? ['studies','media','calendar','focus'] : ['field'];
    const date = value => value ? new Date(value.length === 10 ? value + 'T12:00:00' : value).toLocaleDateString('ru-RU') : 'Не указан';
    const study = id => state.studies.find(item => item.id === Number(id));
    const focusSessions = new Map();
    const transcriptionJobs = new Set();
    const editorState = {studyId:null, document:'questionnaire', dirty:false, loading:0, history:[], revision:0, hintTimer:null, hintRequest:0, hintBusy:false, lastHintAt:0, lastHintText:''};
    const todayISO = () => { const day = new Date(); return `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`; };
    const calendarState = {month:todayISO().slice(0,7), day:todayISO(), tasks:[], summary:null, loading:0};
    let recorder = null, pendingAudio = null;
    window.addEventListener('beforeunload', event => { if (recorder?.state === 'recording' || pendingAudio || editorState.dirty) { event.preventDefault(); event.returnValue = ''; } });

    function storage() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('mlsi-field', 1);
        request.onupgradeneeded = () => {
          request.result.createObjectStore('events', { keyPath:'id' });
          request.result.createObjectStore('cache', { keyPath:'id' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }
    async function store(storeName, mode, operation) {
      const db = await storage();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const request = operation(tx.objectStore(storeName));
        tx.oncomplete = () => { resolve(request.result); db.close(); };
        tx.onerror = () => { reject(tx.error); db.close(); };
        tx.onabort = () => { reject(tx.error); db.close(); };
      });
    }
    const queued = () => store('events','readonly', items => items.getAll());
    async function updateSyncStatus() {
      const count = (await queued()).filter(item => item.userId === state.user?.id).length;
      const el = document.querySelector('#sync-status');
      if (el) el.innerHTML = `${state.offline ? 'Нет сети · ' : ''}${count ? `На устройстве: ${count} · <button type="button" id="sync-now">Отправить</button>` : 'Все данные отправлены'}`;
      const button = document.querySelector('#sync-now'); if (button) button.onclick = syncPending;
    }
    let syncing = false;
    async function syncPending() {
      if (syncing || !state.user || !navigator.onLine) return;
      syncing = true;
      try {
        const session = await api('/session');
        if (!session.user) { state.offline = true; return; }
        if (session.user.id !== state.user.id) { state.user = session.user; await refresh(); notify('Для отправки очереди войдите под пользователем, который собрал данные.',true); return; }
        const events = (await queued()).filter(item => item.userId === session.user.id);
        for (const item of events) {
          await api(`/studies/${item.studyId}/${item.kind === 'refusal' ? 'refusals' : 'responses'}`, 'POST', item.body);
          await store('events','readwrite', items => items.delete(item.id));
        }
        if (events.length || state.offline) { state.offline = false; await refresh(); if (events.length) notify(`Отправлено записей: ${events.length}`); }
      } catch (error) { if (navigator.onLine) notify(`Очередь сохранена. Не удалось отправить: ${error.message}`,true); }
      finally { syncing = false; updateSyncStatus().catch(() => {}); }
    }
    async function queueSurvey(s, kind, body) {
      if (!crypto.randomUUID) throw new Error('Для офлайн-работы нужен HTTPS или localhost.');
      const id = crypto.randomUUID();
      await store('events','readwrite', items => items.add({ id, userId:state.user.id, studyId:s.id, kind, body:{...body, client_id:id} }));
      updateSyncStatus().catch(() => {});
      if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(reg => reg.sync?.register('mlsi-sync')).catch(() => {});
      if (navigator.onLine) syncPending();
    }

    async function api(path, method='GET', body) {
      let response;
      try { response = await fetch('/api' + path, { method, headers: body !== undefined ? { 'Content-Type': 'application/json' } : {}, body: body !== undefined ? JSON.stringify(body) : undefined, credentials: 'same-origin' }); }
      catch { state.offline = true; throw new Error('Нет соединения с сервером. Данные остаются на устройстве.'); }
      const data = await response.json();
      if (!response.ok) { if (response.status === 401 && path !== '/login') { state.user = null; renderAuth(false); } throw new Error(data.error || 'Не удалось выполнить запрос'); }
      return data;
    }
    let noticeTimer;
    function notify(text, error=false) { document.querySelector('.notice')?.remove(); const el = document.createElement('div'); el.className = 'notice' + (error ? ' error' : ''); el.textContent = text; document.body.append(el); clearTimeout(noticeTimer); noticeTimer = setTimeout(() => el.remove(), 4500); }
    async function refresh() { const [users, studies] = await Promise.all([isAdmin() ? api('/users') : Promise.resolve({users:[]}), api('/studies')]); state.users = users.users; state.studies = studies.studies; state.offline = false; if (!allowedTabs().includes(state.tab)) state.tab = allowedTabs()[0]; if (state.user.role === 'interviewer') state.selected = null; if (state.tab !== 'editor' || !editorState.dirty || state.selected != null) render(); try { await store('cache','readwrite', items => items.put({id:'current', user:state.user, users:[], studies:state.studies})); } catch { notify('Не удалось сохранить анкеты для офлайн-работы: проверьте память телефона.',true); } updateSyncStatus().catch(() => {}); }
    async function boot() {
      if (location.pathname.startsWith('/s/')) { await renderPublic(); return; }
      try { const session = await api('/session'); state.user = session.user; if (!state.user) renderAuth(session.setup); else { await refresh(); syncPending(); } }
      catch (error) {
        if (!state.offline) { notify(error.message,true); return; }
        try {
          const cached = await store('cache','readonly', items => items.get('current'));
          if (!cached?.user) { notify('Сначала войдите в приложение с интернетом, чтобы сохранить анкеты.',true); return; }
          Object.assign(state,{user:cached.user,users:cached.users,studies:cached.studies,offline:true,tab:'field'});
          render(); updateSyncStatus();
          notify('Офлайн-режим: заполненные анкеты и отказы сохраняются на устройстве.');
        } catch { notify('Офлайн-данные недоступны на этом устройстве.',true); }
      }
    }
    window.addEventListener('online', () => { if (state.user) syncPending(); else boot(); });
    window.addEventListener('focus', () => { if (state.user && navigator.onLine) syncPending(); });
    setInterval(() => { if (state.user && navigator.onLine) queued().then(items => { if (state.offline || items.some(item => item.userId === state.user?.id)) syncPending(); }).catch(() => {}); }, 30000);
    setInterval(() => { if (state.selected != null && !state.offline && document.visibilityState === 'visible') loadMessages(state.selected); }, 12000);
    navigator.serviceWorker?.addEventListener('message', event => { if (event.data === 'mlsi-synced' && state.user && navigator.onLine) { refresh().catch(() => {}); updateSyncStatus().catch(() => {}); } });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

    function renderAuth(setup) {
      app.innerHTML = `<div class="auth-wrap"><div class="auth-art"><div class="brand">НИЛ «МЛСИ»</div><div><div class="eyebrow">Пространство для исследований</div><h1>Исследуйте людей.<br>Не теряйте детали.</h1><p>Проекты, команда, полевые этапы и данные опросов в одном рабочем пространстве лаборатории.</p></div><small>НИЛ «МЛСИ» / РАБОЧЕЕ ПРОСТРАНСТВО</small></div><div class="auth-form"><div class="auth-card"><div class="eyebrow">${setup ? 'Начало работы' : 'С возвращением'}</div><h2>${setup ? 'Создать лабораторию' : 'Войти в систему'}</h2><p class="lead">${setup ? 'Первая учётная запись получит права администратора.' : 'Введите данные своей учётной записи.'}</p><form id="auth-form" class="form-grid">${setup ? '<div><label class="field-label">Ваше имя</label><input name="name" required maxlength="100" autocomplete="name"></div>' : ''}<div><label class="field-label">Email</label><input name="email" type="email" required autocomplete="email"></div><div><label class="field-label">Пароль</label><input name="password" type="password" required minlength="10" autocomplete="${setup ? 'new-password' : 'current-password'}"></div><button class="btn" type="submit">${setup ? 'Создать пространство →' : 'Войти →'}</button></form></div></div></div>`;
      document.querySelector('#auth-form').onsubmit = async event => { event.preventDefault(); const form = event.currentTarget; const data = Object.fromEntries(new FormData(form)); const button = form.querySelector('button'); button.disabled = true; try { await api(setup ? '/setup' : '/login', 'POST', data); const session = await api('/session'); state.user = session.user; await refresh(); syncPending(); } catch (error) { notify(error.message, true); } finally { button.disabled = false; } };
    }

    function render() {
      if (!state.user) return;
      if (!allowedTabs().includes(state.tab)) state.tab = allowedTabs()[0];
      if (state.user.role === 'interviewer') state.selected = null;
      const active = state.selected != null ? 'studies' : state.tab;
      const navigation = [['overview','▦','Обзор'],['studies','◫','Исследования'],['media','◈','Медиаанализ'],['calendar','▦','Календарь'],['field','◉','Полевой опрос'],['focus','◎','Фокус-группы'],['editor','✎','Редактор'],['team','♙','Команда']].filter(([key]) => allowedTabs().includes(key));
      const calendarView = state.selected == null && state.tab === 'calendar';
      if (calendarView) state.tab = 'studies';
      app.innerHTML = `<div class="shell"><aside class="sidebar"><div class="brand">НИЛ «МЛСИ»</div><div class="brand-sub">Социологическая лаборатория</div><div class="nav-label">Рабочее пространство</div><nav>${navigation.map(([key,icon,label]) => `<button class="nav-item ${active === key ? 'active' : ''}" data-tab="${key}"><span class="nav-icon">${icon}</span>${label}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="user-card"><span class="avatar">${esc(state.user.name.slice(0,1).toUpperCase())}</span><div><strong>${esc(state.user.name)}</strong><small>${roles[state.user.role]}</small></div></div><button class="logout" id="logout">Выйти из аккаунта →</button></div></aside><div class="main"><div class="topbar"><span class="breadcrumb">НИЛ «МЛСИ» <span style="color:#94b2c8">/</span> <b>${state.selected != null ? 'Исследование' : ({overview:'Обзор',studies:'Исследования',media:'Медиаанализ',field:'Полевой опрос',focus:'Фокус-группы',editor:'Редактор',team:'Команда'})[state.tab]}</b></span><span class="sync-status" id="sync-status"></span></div><main class="page" id="content">${state.selected != null ? renderDetail(study(state.selected)) : ({overview:renderOverview,studies:renderStudies,media:renderMedia,field:renderField,focus:renderFocus,editor:renderEditor,team:renderTeam})[state.tab]()}</main></div></div>`;
      if (calendarView) { state.tab = 'calendar'; document.querySelector('.breadcrumb b').textContent = 'Календарь'; document.querySelector('#content').innerHTML = renderCalendar(); }
      if (state.selected == null && state.tab === 'overview' && state.studies.some(s => s.member_quotas?.length)) {
        document.querySelector('#content').insertAdjacentHTML('beforeend', `<section class="quota-board"><div class="section-head"><h2>Персональные составные квоты</h2><span>Без весов, Excel и ответов по ссылке</span></div><div class="quota-list">${state.studies.filter(s => s.member_quotas?.length).map(s => `<div class="quota-group"><h3>${esc(s.title)}</h3>${quotaMarkup(s.member_quotas.map(q => ({label:q.label + ' · ' + q.user_name,rows:[q]})))}</div>`).join('')}</div></section>`);
      }
      if (state.selected != null && study(state.selected)) {
        const s = study(state.selected);
        if (isAdmin()) document.querySelector('.page-head')?.insertAdjacentHTML('beforeend', `<button class="btn secondary" data-action="delete-study" data-id="${s.id}">Удалить проект</button>`);
        document.querySelector('.detail-layout .description').insertAdjacentHTML('afterend', `<p class="description"><strong>Цель исследования</strong><br>${esc(s.goal || 'Не указана.')}</p><p class="description"><strong>Задачи исследования</strong><br>${esc(s.tasks || 'Не указаны.')}</p>`);
        document.querySelector('.detail-layout > div:last-child').insertAdjacentHTML('beforeend', `<section class="box"><div class="box-title"><h2>Полевые результаты</h2></div><div class="info-grid"><div><div class="info-label">Заполнено анкет</div><div class="info-value">${s.response_count}</div></div><div><div class="info-label">Отказов</div><div class="info-value">${s.refusal_count ?? 0}</div></div></div><p class="muted" style="margin:14px 0 0">Неотправленные записи на телефоне появятся здесь после синхронизации.</p></section>`);
        document.querySelector('#content').insertAdjacentHTML('beforeend', `<section class="box report-section"><div class="box-title"><h2>Команда и составные квоты</h2>${canManage() ? `<button class="btn small secondary" data-action="edit-members" data-id="${s.id}">Добавить сотрудников</button>` : ''}</div><p class="muted">Квота учитывает только анкеты, отправленные назначенным сотрудником, когда все условия выполняются одновременно. Ответы по ссылке и Excel сюда не входят.</p><p>${(s.member_ids || []).map(id => esc(state.users.find(u => u.id === id)?.name || `Сотрудник #${id}`)).join(', ') || 'Сотрудники пока не назначены.'}</p><div class="quota-list">${quotaMarkup((s.member_quotas || []).map(q => ({label:q.label + ' · ' + (state.users.find(u => u.id === q.user_id)?.name || `#${q.user_id}`),rows:[q]})))}</div>${canManage() ? `<button class="btn small secondary" data-action="edit-compound" data-id="${s.id}">Настроить составные квоты</button>` : ''}</section><section class="box report-section"><div class="box-title"><h2>Квоты по вопросам</h2></div><p class="muted">Прогресс по числу отправленных анкет без весов и отказов. До синхронизации ответы с телефона не учитываются.</p><div class="quota-list">${quotaMarkup(s.quotas || [])}</div>${canManage() ? `<button class="btn small secondary" type="button" data-action="edit-quotas" data-id="${s.id}">Настроить квоты</button>` : ''}</section>${canManage() ? `<section class="box report-section"><div class="box-title"><h2>Ссылка для онлайн-опроса</h2></div><p class="muted">Любой человек со ссылкой может ответить без учётной записи. Не передавайте ссылку вне целевой аудитории.</p><div id="survey-link">Загружаем ссылку…</div></section>` : ''}<section class="box report-section"><div class="box-title"><h2>Фокус-группы</h2>${canManage() ? `<button class="btn small secondary" data-action="new-focus" data-id="${s.id}">+ Новая группа</button>` : ''}</div><div id="focus-list">Загружаем встречи…</div></section><section class="box report-section"><div class="box-title"><h2>Чат исследования</h2><span class="muted">Команда проекта</span></div><div class="chat-messages" id="chat-messages" aria-live="polite"><p class="muted">Загружаем сообщения…</p></div>${!state.offline ? `<form id="chat-form" class="chat-form"><textarea name="body" maxlength="2000" required placeholder="Написать команде…" aria-label="Сообщение команде"></textarea><button class="btn small" type="submit">Отправить</button></form>` : '<p class="muted">Чат доступен только при подключении к серверу.</p>'}</section>`);
        if (!isAdmin()) document.querySelectorAll('[data-action="edit-members"],[data-action="edit-compound"]').forEach(element => element.remove());
        if (!state.offline) loadMessages(s.id);
        if (canManage()) loadSurveyLink(s.id);
        if (!state.offline) loadFocus(s.id); else document.querySelector('#focus-list').textContent = 'Фокус-группы доступны при подключении к серверу.';
        const chat = document.querySelector('#chat-form'); if (chat) chat.onsubmit = event => sendMessage(event, s.id);
      }
      if (state.selected == null && state.tab === 'focus' && !state.offline) state.studies.forEach(s => { loadFocus(s.id); loadDigitalFocus(s.id); });
      if (state.selected == null && state.tab === 'editor' && !state.offline && state.studies.length) bindEditor();
      if (state.selected == null && state.tab === 'media' && !state.offline) loadMedia();
      if (calendarView && !state.offline) loadCalendar();

    function parseDraftQuestions(text) {

        const options = rest.map(line => line.replace(/^[-•]\s+/, '').trim());
        if (!label || label.length > 250 || options.some(option => !option || option.length > 180)) throw new Error('Проверьте длину вопросов и вариантов ответа.');

      if (!container) return;
      if (!presentationDeck) { container.innerHTML = '<p class="muted">Презентация ещё не создана.</p>'; return; }
      container.innerHTML = `${stale ? '<p style="color:#a34a25">Данные или записка изменились после генерации презентации. Обновите материалы перед передачей.</p>' : ''}<div class="slide-tools"><label for="slide-select">Слайд</label><select id="slide-select">${presentationDeck.slides.map((_,i) => `<option value="${i}">${i+1} / ${presentationDeck.slides.length}</option>`).join('')}</select><label for="slide-theme">Стиль</label><select id="slide-theme"><option value="">Палитра презентации</option><option value="ocean">Глубокий синий</option><option value="coral">Тёплый коралл</option><option value="forest">Лесной</option></select><button type="button" class="btn small" id="slide-save">Сохранить правки</button><a class="btn small secondary" href="/api/studies/${studyId}/presentation.pptx">Скачать PPTX ↓</a></div><div id="slide-stage" class="slide-stage"></div><div id="slide-editor"></div><p class="muted">Выберите блок для редактирования текста; потяните блок на слайде для перемещения. Меняйте компоновку и цветовую тему, затем сохраните правки перед скачиванием.</p>`;
      const select = container.querySelector('#slide-select'), stage = container.querySelector('#slide-stage'), editor = container.querySelector('#slide-editor');
      let selected = 0;
      const show = () => {
        const colors = presentationDeck.colors, slide = presentationDeck.slides[Number(select.value)], elements = slide.elements;
        selected = Math.min(selected,elements.length-1);
        stage.style.backgroundColor = slide.background || colors.background;
        stage.innerHTML = '';
        if (slide.design) {
          const design = slide.design;
          const decoration = (klass,color) => {
            const node = document.createElement('div'); node.className = `slide-decoration ${klass}`;
            node.style.backgroundColor = color; stage.append(node);
          };
           const ornaments = new Set(design.decorations || ['panel','stripe','shape','pill','rule','page']);
           if (design.variant === 'cover') {
             if (ornaments.has('shape')) { decoration('cover-orb',design.panel); decoration('cover-orb-inner',design.soft); }
             if (ornaments.has('stripe')) decoration('cover-stripe',design.accent);
            } else {
             if (ornaments.has('panel')) decoration('card',design.panel);
             if (ornaments.has('stripe')) decoration('stripe',design.accent);
             if (ornaments.has('shape')) {
               if (design.layout === 'split') decoration('split-panel',design.soft);
               else if (design.layout === 'spotlight') decoration('spotlight-panel',design.soft);
               else decoration('dot',design.soft);
             }
           }
           if (ornaments.has('pill')) decoration('pill',design.soft);
           if (ornaments.has('panel') && (!design.layout || design.layout === 'classic') && elements.some(element => element.kind === 'callout')) decoration('callout-card',design.soft);
           if (ornaments.has('rule')) decoration('rule',design.soft);
           if (ornaments.has('page')) { const page = document.createElement('span'); page.className = 'slide-page';
             page.textContent = `${String(Number(select.value)+1).padStart(2,'0')} / ${String(presentationDeck.slides.length).padStart(2,'0')}`;
             page.style.color = design.accent; stage.append(page); }
        }
        elements.forEach((element,i) => {
          const node = document.createElement('div');
          node.className = `slide-element ${element.kind}${i === selected ? ' selected' : ''}`;
          node.dataset.elementIndex = i;
          node.textContent = element.text;
           Object.assign(node.style,{left:`${element.x}%`,top:`${element.y}%`,width:`${element.w}%`,height:`${element.h}%`,color:element.style?.color || (element.kind === 'title' ? colors.accent : colors.text),fontFamily:element.style?.font || 'Aptos',fontWeight:element.style ? (element.style.bold ? '700' : '400') : '',fontSize:element.style ? `${Math.max(9,element.style.size * stage.clientHeight / 540 * 4/3)}px` : ''});
          node.onpointerdown = event => {
            if (event.button !== 0) return;
            selected = i; showEditor();
            stage.querySelectorAll('.slide-element').forEach(item => item.classList.toggle('selected',Number(item.dataset.elementIndex) === i));
            const startX = event.clientX, startY = event.clientY, x = element.x, y = element.y;
            node.setPointerCapture(event.pointerId);
            node.onpointermove = move => {
              if (!node.hasPointerCapture(move.pointerId)) return;
              element.x = Math.round(Math.max(0,Math.min(100-element.w,x + (move.clientX-startX)/stage.clientWidth*100))*10)/10;
              element.y = Math.round(Math.max(0,Math.min(100-element.h,y + (move.clientY-startY)/stage.clientHeight*100))*10)/10;
              node.style.left = `${element.x}%`; node.style.top = `${element.y}%`;
            };
            node.onpointerup = () => { node.onpointermove = null; };
          };
          stage.append(node);
        });
        showEditor();
      };
      const showEditor = () => {
        const slide = presentationDeck.slides[Number(select.value)], element = slide.elements[selected];
          const currentStyle = element.style || {font:element.kind === 'title' ? 'Aptos Display' : 'Aptos',size:element.kind === 'title' ? 28 : 17,bold:element.kind === 'title',color:element.kind === 'title' ? presentationDeck.colors.accent : presentationDeck.colors.text};
          const fontOptions = ['Aptos','Aptos Display','Arial','Calibri','Georgia','Inter','Times New Roman','Verdana'];
          const decorationOptions = [['panel','Карточка'],['stripe','Акцентная полоса'],['shape','Форма'],['pill','Плашка'],['rule','Разделитель'],['page','Номер страницы']];
          editor.innerHTML = `<label class="field-label" for="slide-text">${({title:'Заголовок',body:'Текст',tag:'Ярлычок',callout:'Главный вывод'})[element.kind]} — объект ${selected+1}</label><textarea id="slide-text" maxlength="1200"></textarea><div class="presentation-fields"><label class="field-label">Шрифт<select id="slide-font-family">${fontOptions.map(font => `<option value="${font}" ${currentStyle.font === font ? 'selected' : ''}>${font}</option>`).join('')}</select></label><label class="field-label">Размер текста<input id="slide-font-size" type="number" min="8" max="64" step=".5" value="${currentStyle.size}"></label><label class="field-label">Цвет текста<input id="slide-font-color" type="color" value="${currentStyle.color}"></label><label class="check-label"><input id="slide-font-bold" type="checkbox" ${currentStyle.bold ? 'checked' : ''}> Жирный текст</label><label class="field-label">Фон слайда<input id="slide-background" type="color" value="${slide.background || presentationDeck.colors.background}"></label></div>${slide.design && slide.design.variant === 'content' ? `<label class="field-label">Компоновка слайда<select id="slide-layout"><option value="classic">Классическая карточка</option><option value="split" ${!slide.elements.some(e => e.kind === 'callout') ? 'disabled' : ''}>Две колонки</option><option value="spotlight" ${!slide.elements.some(e => e.kind === 'callout') ? 'disabled' : ''}>Крупный вывод</option></select></label>` : ''}${slide.design ? `<div class="presentation-fields"><span class="field-label">Элементы оформления</span>${decorationOptions.map(([key,label]) => `<label class="check-label"><input class="slide-decoration-toggle" data-decoration="${key}" type="checkbox" ${(slide.design.decorations || ['panel','stripe','shape','pill','rule','page']).includes(key) ? 'checked' : ''}> ${label}</label>`).join('')}</div>` : ''}`;
         if (editor.querySelector('#slide-layout')) {
           editor.querySelector('#slide-layout').value = slide.design.layout || 'classic';
           editor.querySelector('#slide-layout').onchange = event => {
             const layout = event.target.value;
             if (layout !== 'classic' && (slide.elements.find(e => e.kind === 'body')?.text.length || 0) > 360) { notify('Для этой компоновки сократите основной текст до 360 символов',true); event.target.value = slide.design.layout || 'classic'; return; }
             slide.design.layout = layout;
             const body = slide.elements.find(e => e.kind === 'body'), callout = slide.elements.find(e => e.kind === 'callout');
             if (body) Object.assign(body,layout === 'split' ? {x:11,y:40,w:37,h:42} : layout === 'spotlight' ? {x:11,y:66,w:77,h:20} : {x:10,y:38,w:79,h:35});
             if (callout) Object.assign(callout,layout === 'split' ? {x:55,y:43,w:32,h:37} : layout === 'spotlight' ? {x:11,y:38,w:76,h:23} : {x:10,y:77,w:79,h:11});
             show();
           };
         }
        const input = editor.querySelector('textarea'); input.value = element.text;
        input.oninput = () => { element.text = input.value; stage.querySelector(`[data-element-index="${selected}"]`).textContent = input.value; };
         const style = () => element.style ||= {font:'Aptos',size:element.kind === 'title' ? 28 : 17,bold:element.kind === 'title',color:element.kind === 'title' ? presentationDeck.colors.accent : presentationDeck.colors.text};
         editor.querySelector('#slide-font-family').onchange = event => { style().font = event.target.value; show(); };
         editor.querySelector('#slide-font-bold').onchange = event => { style().bold = event.target.checked; show(); };
        editor.querySelector('#slide-font-size').onchange = event => {
          const size = Number(event.target.value);
          if (!Number.isFinite(size) || size < 8 || size > 64) { notify('Размер шрифта: от 8 до 64',true); return; }
          style().size = size; show();
        };
        editor.querySelector('#slide-font-color').oninput = event => { style().color = event.target.value; stage.querySelector(`[data-element-index="${selected}"]`).style.color = event.target.value; };
        editor.querySelector('#slide-background').oninput = event => { slide.background = event.target.value; stage.style.backgroundColor = event.target.value; };
         editor.querySelector('#slide-background').onchange = () => {
          if (slide.design) {
            const blend = (from,to,ratio) => '#' + [1,3,5].map(i => Math.round(parseInt(from.slice(i,i+2),16)*(1-ratio) + parseInt(to.slice(i,i+2),16)*ratio).toString(16).padStart(2,'0')).join('');
            const dark = [0.2126,0.7152,0.0722].reduce((sum,weight,i) => sum + parseInt(slide.background.slice(1+i*2,3+i*2),16)*weight,0) < 145;
            const target = dark ? '#ffffff' : slide.design.accent;
            slide.design.panel = blend(slide.background,target,dark ? .10 : .045);
            slide.design.soft = blend(slide.background,target,dark ? .18 : .10);
          }
           show();
         };
         editor.querySelectorAll('.slide-decoration-toggle').forEach(input => input.onchange = () => {
           slide.design.decorations = [...editor.querySelectorAll('.slide-decoration-toggle:checked')].map(item => item.dataset.decoration);
           show();
         });
      };
       select.onchange = () => { selected = 0; show(); };
       container.querySelector('#slide-theme').onchange = event => {
         const themes = {ocean:{background:'#f2f7fc',text:'#17324d',accent:'#147ca5'},coral:{background:'#fff7f1',text:'#432a32',accent:'#c45155'},forest:{background:'#f1f8f2',text:'#193d38',accent:'#237966'}};
         const palette = themes[event.target.value]; if (!palette) return;
         presentationDeck.colors = {...palette};
         const blend = (from,to,ratio) => '#' + [1,3,5].map(i => Math.round(parseInt(from.slice(i,i+2),16)*(1-ratio)+parseInt(to.slice(i,i+2),16)*ratio).toString(16).padStart(2,'0')).join('');
         presentationDeck.slides.forEach(slide => {
           const cover = slide.design?.variant === 'cover';
           slide.background = cover ? blend(palette.accent,'#091b30',.75) : palette.background;
           if (slide.design) Object.assign(slide.design,{accent:palette.accent,panel:blend(slide.background,cover ? '#ffffff' : palette.accent,cover ? .10 : .045),soft:blend(slide.background,cover ? '#ffffff' : palette.accent,cover ? .18 : .10)});
           slide.elements.forEach(element => { if (element.style) element.style.color = cover ? '#ffffff' : element.kind === 'body' ? palette.text : palette.accent; });
         });
         for (const key of ['background','text','accent']) document.querySelector(`#presentation-${key}`).value = palette[key];
         show(); notify('Тема применена. Сохраните правки.');
       };
      container.querySelector('#slide-save').onclick = async event => {
        const button = event.currentTarget; button.disabled = true;
        try { await api(`/studies/${studyId}/presentation`,'PUT',presentationDeck); notify('Правки презентации сохранены'); }
        catch (error) { notify(error.message,true); }
        finally { if (button.isConnected) button.disabled = false; }
      };
      show();
    }
    function questionBlock(q={ type:'text', label:'', options:[], required:false }) {
      return `<div class="question-edit"><div class="question-top"><strong>ВОПРОС</strong><button type="button" class="text-button remove-question">Удалить</button></div><div class="form-two"><div><label class="field-label">Формулировка *</label><input class="q-label" required maxlength="250" value="${esc(q.label)}" placeholder="Ваш вопрос"></div><div><label class="field-label">Тип ответа</label><select class="q-type">${Object.entries(types).map(([key,label]) => `<option value="${key}" ${q.type === key ? 'selected' : ''}>${label}</option>`).join('')}</select></div></div><div class="q-options-wrap" style="${['single','multiple'].includes(q.type) ? '' : 'display:none'}"><label class="field-label">Варианты ответа (по одному на строке)</label><textarea class="q-options" placeholder="Да&#10;Нет&#10;Затрудняюсь ответить">${esc(q.options.join('\n'))}</textarea></div><label class="check-label"><input class="q-required" type="checkbox" ${q.required ? 'checked' : ''}> Обязательный вопрос</label></div>`;
    }
    function editQuestions(s, draft=s.questions) {
      openModal('Анкета исследования',`<p class="muted">Проверьте типы вопросов, варианты ответа и обязательность перед сохранением. После сбора ответов или настройки квот изменение действующей анкеты запрещено. До 40 вопросов.</p><div id="question-list">${draft.map(questionBlock).join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn small secondary" id="add-question">+ Добавить вопрос</button><label class="btn small secondary" style="cursor:pointer">Импорт JSON <input id="import-questions" type="file" accept=".json,application/json" hidden></label></div><div class="actions"><button type="button" class="btn secondary" id="cancel">Отмена</button><button type="button" class="btn" id="save-questions">Сохранить анкету</button></div>`,true);
      const list = document.querySelector('#question-list');
      document.querySelector('#cancel').onclick = closeModal;
      document.querySelector('#add-question').onclick = () => { if (list.children.length >= 40) { notify('Не более 40 вопросов',true); return; } list.insertAdjacentHTML('beforeend',questionBlock()); };
      list.onchange = event => { if (event.target.classList.contains('q-type')) event.target.closest('.question-edit').querySelector('.q-options-wrap').style.display = ['single','multiple'].includes(event.target.value) ? '' : 'none'; };
      list.onclick = event => { if (event.target.classList.contains('remove-question')) event.target.closest('.question-edit').remove(); };
      document.querySelector('#import-questions').onchange = async event => { const file = event.target.files[0]; if (!file) return; try { const data = JSON.parse(await file.text()); const questions = Array.isArray(data) ? data : data.questions; if (!Array.isArray(questions) || questions.length > 40 || questions.some(q => !q || typeof q.label !== 'string' || !types[q.type] || !Array.isArray(q.options || []))) throw new Error('Неверный формат файла'); list.innerHTML = questions.map(q => questionBlock({ ...q, options:q.options || [] })).join(''); notify('Анкета импортирована. Нажмите «Сохранить анкету».'); } catch (error) { notify(error.message,true); } };
      document.querySelector('#save-questions').onclick = async () => { const questions = [...list.children].map(item => ({ label:item.querySelector('.q-label').value.trim(), type:item.querySelector('.q-type').value, options:item.querySelector('.q-options').value.split('\n').map(v=>v.trim()).filter(Boolean), required:item.querySelector('.q-required').checked })); if (questions.some(q => !q.label)) { notify('Заполните формулировки вопросов',true); return; } try { await api('/studies/'+s.id+'/questionnaire','POST',{questions}); closeModal(); await refresh(); notify('Анкета сохранена'); } catch (error) { notify(error.message,true); } };
    }
    function openSurvey(s) {
      if (!s.questions.length) return;
      openModal('Опрос: '+esc(s.title),`<p class="muted">Ответы сохраняются в проекте. Рекомендуем использовать обезличенный код респондента.</p><form id="survey-form" class="form-grid" data-id="${s.id}"><div><label class="field-label">Код респондента (необязательно)</label><input name="code" maxlength="80" placeholder="Например: Р-001" autocomplete="off"></div>${s.questions.map((q,i) => `<div class="survey-item"><strong>${i+1}. ${esc(q.label)} ${q.required ? '<span style="color:var(--orange)">*</span>' : ''}</strong>${q.type === 'single' || q.type === 'multiple' ? q.options.map(option => `<label class="survey-choice"><input type="${q.type === 'single' ? 'radio' : 'checkbox'}" name="${q.id}" value="${esc(option)}">${esc(option)}</label>`).join('') : q.type === 'textarea' ? `<textarea name="${q.id}" ${q.required ? 'required' : ''} maxlength="2000" placeholder="Введите ответ"></textarea>` : `<input name="${q.id}" type="${q.type === 'number' ? 'number' : 'text'}" ${q.type === 'number' ? 'step="any"' : ''} ${q.required ? 'required' : ''} maxlength="2000" placeholder="Введите ответ">`}</div>`).join('')}<div class="actions"><button type="button" class="btn secondary" id="cancel">Отмена</button><button type="submit" class="btn orange">Сохранить ответ →</button></div></form>`,true);
      document.querySelector('#survey-form .actions').insertAdjacentHTML('afterbegin','<button type="button" class="btn secondary" id="record-refusal">Отказ</button>');
      document.querySelector('#record-refusal').onclick = async event => {
        if (!confirm('Зарегистрировать отказ без сохранения заполненной анкеты?')) return;
        const button = event.currentTarget; button.disabled = true;
        try { await queueSurvey(s,'refusal',{}); closeModal(); notify('Отказ сохранён на устройстве. Синхронизация произойдёт при доступе к серверу.'); }
        catch (error) { notify(`Отказ не сохранён: ${error.message}`,true); button.disabled = false; }
      };
      document.querySelector('#cancel').onclick = closeModal;
      document.querySelector('#survey-form').onsubmit = submitSurvey;
    }
    async function submitSurvey(event) {
      event.preventDefault(); const form = event.currentTarget, s = study(form.dataset.id), data = new FormData(form), answers = {};
      for (const q of s.questions) answers[q.id] = q.type === 'multiple' ? data.getAll(q.id) : data.get(q.id) || '';
      if (s.questions.some(q => q.required && !answers[q.id].length)) { notify('Ответьте на все обязательные вопросы.',true); return; }
      const button = form.querySelector('[type="submit"]'); button.disabled = true;
      try { await queueSurvey(s,'response',{code:data.get('code') || '',answers}); notify('Анкета сохранена на устройстве. Она отправится при доступе к серверу.'); openSurvey(s); }
      catch (error) { notify(`Анкета не сохранена: ${error.message}`,true); button.disabled = false; }
    }
    boot();
  </script>
</body>
</html>
