<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сеть ИИ-агентов · Анализ зарубежных СМИ</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Сеть ИИ-агентов · Зарубежные СМИ</div>
    <nav>
      <button data-view="feed" class="active">Лента</button>
      <button data-view="feeds">Источники</button>
      <button data-view="stats">Сводка</button>
      <button data-view="reports">Отчёты</button>
      <span id="aiStatus" class="badge muted">…</span>
    </nav>
  </header>

  <main>
    <div id="loading" class="panel spinner hidden">Агенты работают…</div>
    <div id="view"></div>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
